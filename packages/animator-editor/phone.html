<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Atlas Animator phone</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ok-lo); color: var(--white); font: 14px/1.3 system-ui, sans-serif; -webkit-user-select: none; user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
      canvas { display: block; position: fixed; inset: 0; }
      #bar { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: center; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); background: rgba(10, 14, 8, 0.55); z-index: 2; }
      #bar b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
      #bar button { font: inherit; color: var(--white); background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 8px; padding: 8px 12px; min-height: 40px; }
      #bar button:active { background: rgba(255, 255, 255, 0.32); }
      #note { position: fixed; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom)); text-align: center; z-index: 2; pointer-events: none; text-shadow: 0 1px 3px var(--black); }
    </style>
  </head>
  <body>
    <div id="bar"><b id="title">Waiting for the editor...</b><button id="face">Facing: left</button><button id="scale">0.4</button></div>
    <div id="note">connecting...</div>
    <script type="module" src="/src/phonePage.ts"></script>
  </body>
</html>
